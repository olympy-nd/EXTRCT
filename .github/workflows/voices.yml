name: generate-voices
on:
  push:
    branches: [voices]
permissions:
  contents: write
jobs:
  tts:
    if: ${{ !contains(github.event.head_commit.message, '[clips]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install edge-tts
      - name: Generate clips
        run: |
          mkdir -p clips
          edge-tts --voice ar-YE-SalehNeural  --rate=-15% --pitch=-8Hz --text "السَّحْلُوغَا."      --write-media clips/sah.mp3
          edge-tts --voice ar-YE-SalehNeural  --rate=-15% --pitch=-8Hz --text "تَمَّتِ السَّحْلَغَا" --write-media clips/d2a.mp3
          edge-tts --voice ar-SA-HamedNeural  --rate=-15% --pitch=-8Hz --text "بِنَجَاحْ."          --write-media clips/d2b.mp3
          edge-tts --voice ar-SA-HamedNeural  --rate=-15% --pitch=-8Hz --text "تَمَّتِ السَّحْلَغَا بِنَجَاحْ." --write-media clips/d2_hamed_full.mp3
          edge-tts --voice ar-YE-SalehNeural  --rate=-15% --pitch=-8Hz --text "تَمَّتِ السَّحْلَغَا بِنَجَاحْ." --write-media clips/d2_saleh_full.mp3
          edge-tts --voice ar-AE-HamdanNeural --rate=-15% --pitch=-8Hz --text "بْزُقْ!"             --write-media clips/bzq.mp3
          ls -la clips
      - name: Commit clips
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898419+github-actions[bot]@users.noreply.github.com"
          git add clips
          git commit -m "[clips] generated voice clips"
          git push
